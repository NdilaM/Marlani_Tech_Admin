<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Modern</title>
  <!-- Font Awesome (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Google Font (Nunito) -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* ----- card: image left, form right ----- */
    .card {
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    /* left image panel */
    .register-image {
      flex: 1 1 45%;
      background: url('img/company_login.png') center/cover no-repeat;
      min-height: 320px;
      position: relative;
    }

    /* subtle overlay */
    .register-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(78, 115, 223, 0.08);
      backdrop-filter: blur(0.5px);
    }

    /* right panel — form */
    .register-form {
      flex: 1 1 55%;
      padding: 2.8rem 2.8rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
    }

    /* ----- typography & spacing ----- */
    .text-center {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      display: inline-block;
      background: #4e73df10;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #4e73df;
      letter-spacing: 0.3px;
      margin-bottom: 0.5rem;
    }

    .text-center h1 {
      font-weight: 800;
      font-size: 2rem;
      color: #2d3748;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
    }

    .text-center p {
      color: #718096;
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* ----- form fields ----- */
    .form-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group .input-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      font-size: 1rem;
      transition: color 0.2s;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 40px;
      font-size: 0.95rem;
      font-family: 'Nunito', sans-serif;
      background: #f7fafc;
      transition: all 0.25s ease;
      color: #2d3748;
      font-weight: 500;
    }

    .form-group input:focus {
      outline: none;
      border-color: #4e73df;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(78, 115, 223, 0.15);
    }

    .form-group input::placeholder {
      color: #a0aec0;
      font-weight: 400;
      font-size: 0.9rem;
    }

    /* password eye (JS toggles) */
    .toggle-eye {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      cursor: pointer;
      z-index: 2;
      transition: color 0.2s;
      font-size: 1rem;
    }
    .toggle-eye:hover {
      color: #4e73df;
    }

    /* ----- buttons ----- */
    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
      margin-bottom: 0.9rem;
    }

    .btn-primary {
      background: #4e73df;
      color: #fff;
      box-shadow: 0 8px 18px -6px rgba(78, 115, 223, 0.4);
    }
    .btn-primary:hover {
      background: #2e59d9;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(78, 115, 223, 0.5);
    }

    .btn-google {
      background: #fff;
      color: #444;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-weight: 600;
    }
    .btn-google i {
      color: #dd4b39;
      font-size: 1.2rem;
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e0;
      transform: translateY(-2px);
    }

    .btn-facebook {
      background: #fff;
      color: #444;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-weight: 600;
    }
    .btn-facebook i {
      color: #1877f2;
      font-size: 1.2rem;
    }
    .btn-facebook:hover {
      background: #f8fafc;
      border-color: #cbd5e0;
      transform: translateY(-2px);
    }

    /* ----- divider ----- */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.2rem 0 1.8rem 0;
    }
    .divider-line {
      flex: 1;
      height: 1.5px;
      background: #e2e8f0;
    }
    .divider-text {
      color: #a0aec0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ----- action links ----- */
    .action-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 0.5rem;
    }
    .action-links a {
      color: #4e73df;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .action-links a:hover {
      color: #224abe;
      text-decoration: underline;
    }

    /* ----- footer note ----- */
    .footer-note {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.75rem;
      color: #a0aec0;
      letter-spacing: 0.3px;
    }

    /* ----- responsive ----- */
    @media (max-width: 768px) {
      .card {
        flex-direction: column;
      }
      .register-image {
        flex: 1 1 100%;
        min-height: 200px;
      }
      .register-form {
        padding: 2rem 1.8rem;
      }
      .form-row {
        flex-direction: column;
        gap: 1.5rem;
      }
      .action-links {
        flex-direction: column;
        gap: 0.8rem;
        align-items: center;
      }
    }

    @media (max-width: 480px) {
      .register-form {
        padding: 1.5rem 1.2rem;
      }
      .text-center h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <!-- LEFT: image -->
    <div class="register-image" aria-label="Register visual"></div>

    <!-- RIGHT: registration form -->
    <div class="register-form">
      <div class="text-center">
        <h1>Create Account</h1>
        <p>Start your journey with us today</p>
      </div>

      <form class="user" action="#" method="POST">
        <!-- name row -->
        <div class="form-row">
          <div class="form-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" id="firstName" placeholder="First name" required />
          </div>
          <div class="form-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" id="lastName" placeholder="Last name" required />
          </div>
        </div>

        <!-- email -->
        <div class="form-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" class="form-control" id="emailInput" placeholder="Email address" required autocomplete="email" />
        </div>

        <!-- password row -->
        <div class="form-row">
          <div class="form-group password-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" id="passwordInput" placeholder="Password" required autocomplete="new-password" />
            <i class="fas fa-eye toggle-eye" id="togglePassword"></i>
          </div>
          <div class="form-group password-group">
            <i class="fas fa-check input-icon"></i>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required autocomplete="new-password" />
            <i class="fas fa-eye toggle-eye" id="toggleConfirm"></i>
          </div>
        </div>

        <!-- register button -->
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-user-plus" style="margin-right: 8px;"></i> Create Account
        </button>

      </form>

      <!-- action links -->
      <div class="action-links">
        <a href="login.html"><i class="fas fa-sign-in-alt" style="margin-right: 5px;"></i> Already have an account? Login</a>
      </div>

      <div class="footer-note">
        <span>Copyright &copy; Marlani Technologies 2026. All rights reserved.</span>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const form = document.querySelector('.user');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const firstName = document.getElementById('firstName')?.value.trim() || '';
        const lastName = document.getElementById('lastName')?.value.trim() || '';
        const email = document.getElementById('emailInput')?.value.trim() || '';
        const password = document.getElementById('passwordInput')?.value.trim() || '';
        const confirm = document.getElementById('confirmPassword')?.value.trim() || '';

        // Validation
        if (firstName === '' || lastName === '' || email === '' || password === '' || confirm === '') {
          alert('⚠️ Please fill in all fields.');
          return;
        }
        
        if (password !== confirm) {
          alert('⚠️ Passwords do not match.');
          return;
        }
        
        if (password.length < 6) {
          alert('⚠️ Password must be at least 6 characters.');
          return;
        }

        // Check if user already exists
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        if (users.some(u => u.email === email)) {
          alert('❌ An account with this email already exists.');
          return;
        }

        // Save new user
        const newUser = {
          id: Date.now(),
          firstName,
          lastName,
          email,
          password,
          createdAt: new Date().toISOString()
        };
        
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        
        alert('✅ Registration successful! You can now login.');
        window.location.href = 'login.html'; // Redirect to login page
      });
    }

    // Toggle password visibility for both fields
    function setupToggle(buttonId, fieldId) {
      const toggleBtn = document.getElementById(buttonId);
      const passwordField = document.getElementById(fieldId);
      if (toggleBtn && passwordField) {
        toggleBtn.addEventListener('click', function() {
          const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordField.setAttribute('type', type);
          this.classList.toggle('fa-eye');
          this.classList.toggle('fa-eye-slash');
        });
      }
    }

    setupToggle('togglePassword', 'passwordInput');
    setupToggle('toggleConfirm', 'confirmPassword');
  })();
</script>
</body>
</html>
